# docker-compose file for fast deployment
version: "3.7"
services:
  web:
    container_name: web
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "8082:80"
    volumes:
      - ./app/conf.d:/etc/nginx/conf.d
    networks:
      - custom
  app:
    container_name: app
    image: fever_code_challenge_app
    environment:
      - REAL_DATABASE_URL=postgresql+asyncpg://postgres:postgres@db/postgres
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - custom
  db:
      image: postgres:14.1-alpine
      container_name: "db"
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=postgres
      ports:
        - "5432:5432"
      networks:
        - custom
networks:
  custom:
    driver: bridge
